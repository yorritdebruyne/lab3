# nginx.conf
# Nginx acts as a reverse proxy: it is the only service exposed to the internet
# (on port 80). All browser requests go through it. Nginx then forwards them
# to the correct internal Docker container.
#
# Why do we need this?
#   The university firewall only allows port 80 from outside.
#   Our nodes run on ports 8081, 8082, 8083 — unreachable from the browser.
#   Nginx sits in the middle and forwards /proxy/8081/ → node-a:8081, etc.
#
# The structure has two parts:
# - An upstream block for each node — gives each node a name so Nginx knows which internal host:port to reach
# - location blocks that match incoming URL paths and proxy them to the correct upstream
events {
    # Required block even if empty. Controls how Nginx handles connections.
    worker_connections 1024;
}

http {

    # ── Upstream definitions ─────────────────────────────────────────────────
    # Each "upstream" gives a name to an internal backend server.
    # The hostnames (naming-server, node-a, etc.) are Docker Compose service names.
    # On Docker's internal network, service names resolve to the container's IP.

    upstream naming_server {
        server naming-server:8080;
    }

    upstream node_8081 {
        # nodeA listens on port 8081 inside the Docker network
        server node-a:8081;
    }

    upstream node_8082 {
        # nodeBeta listens on port 8082
        server node-b:8082;
    }

    upstream node_8083 {
        # nodeGamma listens on port 8083
        server node-c:8083;
    }

    # Docker's internal DNS resolver.
    # Required for node-d because it is not running at startup time.
    # With a variable in proxy_pass, Nginx resolves the hostname per-request
    # instead of at startup, so it won't crash when node-d is stopped.
    resolver 127.0.0.11 valid=10s;

    server {
        # Listen on port 80 — the only port open through the university firewall
        listen 80;

        # ── Node proxy routes ────────────────────────────────────────────────
        # The browser calls /proxy/8081/node/state instead of http://ip:8081/node/state
        # Nginx strips the /proxy/8081 prefix and forwards /node/state to node-a:8081
        #
        # IMPORTANT: the trailing slash on both location and proxy_pass is required.
        # Without it, Nginx does NOT strip the prefix and the node gets /proxy/8081/node/state
        # which it doesn't understand.

        location /proxy/8081/ {
            proxy_pass http://node_8081/;

            # Forward the original Host header so Spring Boot sees the right host
            proxy_set_header Host $host;

            # Forward the real client IP (useful for logging)
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /proxy/8082/ {
            proxy_pass http://node_8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /proxy/8083/ {
            proxy_pass http://node_8083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Node D/E/F proxy (dynamic nodes) ────────────────────────────────
        # These nodes are not running at startup. Using variables + rewrite so
        # Nginx resolves hostnames per-request and returns 502 (not crash) when stopped.
        # node-d may not be running at startup. Using a variable for proxy_pass
        # combined with a rewrite means Nginx resolves the hostname per-request
        # and returns 502 (not crash) when node-d is stopped.
        location /proxy/8084/ {
            set $node_d node-d:8084;
            rewrite ^/proxy/8084/(.*) /$1 break;
            proxy_pass http://$node_d;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /proxy/8085/ {
            set $node_e node-e:8085;
            rewrite ^/proxy/8085/(.*) /$1 break;
            proxy_pass http://$node_e;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /proxy/8086/ {
            set $node_f node-f:8086;
            rewrite ^/proxy/8086/(.*) /$1 break;
            proxy_pass http://$node_f;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Naming server (catch-all) ────────────────────────────────────────
        # Everything else (/, /api/nodes, /assets/, etc.) goes to the naming server.
        # This includes the Vue frontend (served as static files by Spring Boot).

        location / {
            proxy_pass http://naming_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}